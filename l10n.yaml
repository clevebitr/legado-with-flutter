# 国际化生成配置。模板语言为英文，必须在同一个 PR 内补齐 zh 翻译。
# 命名与使用约束见 docs/dev/naming.md §12 与 docs/dev/constraints.md C-UI-5。
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
# 关闭可空 getter，使 AppLocalizations.of(context) 直接返回非空实例，
# 从源头消除 `AppLocalizations.of(context)!` 这种强制解包（C-TYPE-2）。
nullable-getter: false
untranslated-messages-file: l10n_untranslated.json
