name: Feature request
description: 提出一个新功能或改进建议
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        提出前请先阅读 `docs/README.md` 与 `docs/dev/constraints.md`，
        确认建议不与既有约束冲突。若建议会**推翻**某条既有决策，
        请在下方说明理由——这会需要一条新的 ADR。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前的不便或缺口，而不是直接描述实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、API 或 UI 表现。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 书源解析
        - 阅读器
        - 书架
        - 主题与 UI
        - 平台适配
        - 存储与同步
        - 其他
    validations:
      required: true

  - type: textarea
    id: constraints-impact
    attributes:
      label: 与既有约束的关系
      description: |
        是否与 docs/dev/constraints.md 中任何条目冲突？如有，请指出条目 ID
        （例如 C-ARCH-1）并说明为何需要调整。
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意自己实现这个功能
        - label: 我可以提供测试用例或语料
