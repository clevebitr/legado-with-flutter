# L1 门禁：分层的第一层，其余三层在 `build-artifacts.yml`（可复用构建）与
# `release.yml` / `beta.yml` / `debug.yml`（三条发布通道）。判据与版本方案见 ADR-0067，
# 顺序与命令见 `docs/dev/testing.md` §7 与 `AGENTS.md` §4。
#
# `verify` 这个 job 名是 `main` 规则集要求的 status check（CONTRIBUTING.md §5.4），不要改名。
name: CI

on:
  push:
    # `dev` 是集成分支（ADR-0079）：日常提交落在那里，所以 L1 门禁必须跟着它跑。
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  # 手动跑一次门禁：发布通道的 `wait-for-verify` 需要一个 push/tag 的 CI 运行可等。
  workflow_dispatch:

# 同一个 ref 上只留最新一次；PR 取消旧跑，main / tag 上的不相互取消。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build

      - name: Generated files must be committed
        run: git diff --exit-code -- '**/*.g.dart' '**/*.freezed.dart' '**/*.gr.dart'

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Coverage gate
        run: dart run tool/check_coverage.dart
