# =============================================================================
# analysis_options.yaml
# 规范来源（唯一权威）：docs/dev/naming.md、docs/dev/constraints.md
# 规则与约束 ID 的对应关系见 docs/dev/tech-stack.md
# =============================================================================

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # 命名规范（docs/dev/naming.md §2-§5）
    camel_case_types: error
    camel_case_extensions: error
    library_names: error
    file_names: error
    non_constant_identifier_names: error
    constant_identifier_names: error
    always_declare_return_types: error

    # 错误处理（docs/dev/constraints.md C-ERR-2：禁止裸 catch）
    avoid_catches_without_on_clauses: error
    avoid_catching_errors: error
    only_throw_errors: error

    # 异步安全（docs/dev/constraints.md C-ERR-4）
    unawaited_futures: error
    use_build_context_synchronously: error

    # 日志（docs/dev/constraints.md C-ERR-5）
    avoid_print: error

    # 类型安全（docs/dev/constraints.md C-TYPE-1）
    avoid_dynamic_calls: warning

    # 未使用代码（C-BAN-1）：这三项是 analyzer 诊断而非 lint 规则，在此提升为 error
    unused_element: error
    unused_local_variable: error
    unused_import: error

    # 文档注释（docs/dev/naming.md §7）
    public_member_api_docs: warning
    slash_for_doc_comments: warning
    comment_references: warning

    prefer_final_locals: warning
    directives_ordering: warning

  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - web/**
    - .dart_tool/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "**/*.mocks.dart"
    - lib/l10n/generated/**

# =============================================================================
# 分析器插件（新版机制，必须位于顶层）
# riverpod_lint ≥3.1.9 使用 analysis_server_plugin 实现，由 `flutter analyze`
# 执行（ADR-0010）。写在 `analyzer: plugins:` 下会触发
# analysis_options_deprecated_plugins 弃用警告。
# =============================================================================
plugins:
  riverpod_lint: ^3.1.9

linter:
  rules:
    # --- 命名规范（docs/dev/naming.md） ---
    camel_case_types: true
    camel_case_extensions: true
    library_names: true
    file_names: true
    non_constant_identifier_names: true
    constant_identifier_names: true
    always_declare_return_types: true
    avoid_types_as_parameter_names: true
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true

    # --- 文档与注释（docs/dev/naming.md §7） ---
    # 注意：不存在 `prefer_doc_comments` 规则；`///` 偏好由 slash_for_doc_comments 覆盖。
    public_member_api_docs: true
    slash_for_doc_comments: true
    comment_references: true

    # --- 错误处理与异步（docs/dev/constraints.md §3） ---
    avoid_print: true
    unawaited_futures: true
    avoid_catches_without_on_clauses: true
    avoid_catching_errors: true
    only_throw_errors: true
    use_build_context_synchronously: true

    # --- 类型安全（docs/dev/constraints.md §11） ---
    avoid_dynamic_calls: true
    avoid_returning_null_for_void: true
    avoid_void_async: true
    avoid_annotating_with_dynamic: true

    # --- 分层与导入（docs/dev/constraints.md C-ARCH-1） ---
    avoid_relative_lib_imports: true
    always_use_package_imports: true
    directives_ordering: true
    depend_on_referenced_packages: true

    # --- Flutter 特定 ---
    avoid_unnecessary_containers: true
    sort_child_properties_last: true
    use_key_in_widget_constructors: true

    # --- 常量与不可变 ---
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_constructors_in_immutables: true
    prefer_const_literals_to_create_immutables: true

    # --- 安全与性能（docs/dev/constraints.md §10） ---
    avoid_slow_async_io: true
    avoid_web_libraries_in_flutter: true

    # --- 代码质量 ---
    # 注意：`unused_element` / `unused_local_variable` / `unused_import` 不是 lint 规则，
    # 而是 analyzer 诊断，已提升为 error，见上方 analyzer.errors。
    prefer_single_quotes: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    unnecessary_brace_in_string_interps: true
    unnecessary_this: true
    unnecessary_string_escapes: true
    prefer_collection_literals: true
    prefer_spread_collections: true
    prefer_for_elements_to_map_fromIterable: true
    prefer_if_elements_to_conditional_expressions: true
    prefer_generic_function_type_aliases: true
