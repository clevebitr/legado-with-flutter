name: flutter_reader
description: Flutter 阅读 App —— MD3E 设计、多平台支持、Dart 书源解析
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI 与主题：设计令牌的唯一来源（C-UI-1、ADR-0004）
  m3e_design: ^0.2.1
  dynamic_color: ^1.9.0

  # 状态管理：唯一方案 + 强制代码生成（C-STATE-1/2、ADR-0001）
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # 书源解析引擎（book-source.md、ADR-0015）
  html: ^0.15.6
  cascadia: ^0.8.0
  json_path: ^0.9.0
  flutter_qjs_next: ^1.5.2
  betto_charset_detector: ^0.1.0

  # 网络
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # 编码：betto 只检测标签，解码需要 charset 把标签变成 Encoding（C-NET-3）
  charset: ^2.0.1
  # Big5 / Big5-HKSCS：`charset` 没有这两个码表，`enough_convert` 补齐（纯 Dart、零依赖）。
  # 它是 **MPL-2.0**，与 GPL-3.0 兼容（ADR-0048 §决策 1），因此这也是唯一被允许的 MPL 依赖，
  # `tool/scan_licenses.dart` 的允许族与之配套。
  enough_convert: ^1.7.1

  # 持久化：Drift 为主库，drift_flutter 提供各平台原生 SQLite（ADR-0003）
  # 禁止使用 sqlite3_flutter_libs：上游已 EOL（0.6.0+eol），在新版 Android 工具链上
  # 不再正确打包原生库，会在启动时抛 DriftRemoteException。
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

  # 听书与音频（ADR-0054）：播放、Windows 实现、后台通知、系统朗读。
  # `just_audio_windows` 不是联邦插件的 endorsed 实现，必须单独声明（C-BAN-4）。
  just_audio: ^0.10.6
  just_audio_windows: ^0.2.3
  audio_service: ^0.18.19
  # Windows 的 SMTC 走 audio_service 的平台接口实现（MIT，0.0.3）；见 ADR-0062 §决策 4。
  audio_service_win: ^0.0.3
  flutter_tts: ^4.2.5

  # 备份与恢复：zip 编解码（纯 Dart，MIT；ADR-0073 §决策 5）。
  # 只在 `features/backup/domain/` 的编解码模块里使用，页面与 data 层不直接依赖它。
  archive: ^4.5.2

  # 观测：业务侧只允许经 core/logging 使用（C-ERR-5、ADR-0006）
  logger: ^2.8.0
  # 日志脱敏摘要（sha256）与 `@js:` 沙箱的 crypto.* 绑定：仅 core/logging/redaction.dart
  # 与 core/js/ 使用（C-SEC-4、book-source.md §6）
  crypto: ^3.0.7

  # 代码生成注解
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  file_selector: ^1.1.0

  # 系统分享：移动端导出与日志分享走系统分享面板（C-PLT-1、ADR-0083）。
  # BSD-3-Clause，Flutter Community 维护；Android 用 ACTION_SEND、iOS 用 UIActivityViewController。
  share_plus: ^13.3.1

  # 播放后端与 WebView（ADR-0061）：
  # Windows 用 media_kit（libmpv，随包二进制 LGPL-2.1+ 白名单）；Android / iOS 仍用 just_audio。
  # flutter_inappwebview 提供 `,{webView:…}` 的 headless WebView（Apache-2.0）。
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^11.2.0
  pointycastle: ^4.0.0

  # `java.openUrl` 要真的把地址交给系统浏览器（M25/S3b，ADR-0078 §实现注记）：BSD-3-Clause，
  # 三端与 Web 都有实现。只在装配根的确认弹窗实现里使用，其余层只认 `ExternalUrlOpener` 端口。
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint：riverpod_lint ≥3.1.9 已改为 analysis_server_plugin 实现，
  # 通过 analysis_options.yaml 顶层 plugins: 安装，由 flutter analyze 执行；
  # 不再需要 custom_lint（ADR-0010）。
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.9

  # 代码生成
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1

  # 测试：设备级集成测试（Windows / Android 桌面与模拟器），由 Flutter SDK 提供，
  # 不经 pub.dev 下载（BSD-3-Clause，同 `flutter_test`）。
  integration_test:
    sdk: flutter

  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    # GPL-3.0 全文：法律声明页的「查看许可全文」入口（C-UI-9，ADR-0055 §决策 4）。
    # 来源是根目录 LICENSE，更新许可证时两者必须一起换。
    - assets/legal/gpl-3.0.txt
    # 内置规则的种子数据（M20，ADR-0070 增补 §5）：目录规则与字典规则，来自上游
    # `app/src/main/assets/defaultData/`，与本仓同许可（GPL-3.0），来源见 assets/rules/README.md。
    - assets/rules/txt_toc_rule.json
    - assets/rules/dict_rule.json
    # 简繁转换码表（M25/S3b）：`java.t2s` / `java.s2t`。由 OpenCC（Apache-2.0）生成，
    # 来源、生成规则与哈希见 assets/zh/README.md；登记见 NOTICE.md §5。
    - assets/zh/t2s.txt
    - assets/zh/s2t.txt
