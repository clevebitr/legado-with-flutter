name: flutter_reader
description: Flutter 阅读 App —— MD3E 设计、多平台支持、Dart 书源解析
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI 与主题（唯一设计令牌来源，见 docs/dev/constraints.md C-UI-1）
  m3e_design: ^0.2.0
  dynamic_color: ^2.1.0

  # 状态管理（唯一方案 + 强制代码生成，见 ADR-0001）
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^3.0.0

  # 书源解析引擎
  html: ^0.15.6
  cascadia: ^0.8.0
  json_path: ^0.9.0
  flutter_js_plus: ^0.0.4
  betto_charset_detector: ^1.0.0

  # 网络
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # 持久化（Drift 为主库，见 ADR-0003）
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5

  # 观测
  logger: ^2.0.0

  # 代码生成注解
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint
  flutter_lints: ^6.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^3.0.0

  # 代码生成
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.12.0
  riverpod_generator: ^3.0.0
  drift_dev: ^2.20.0

  # 测试
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
