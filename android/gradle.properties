org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin 增量编译缓存在 Windows 上偶发文件锁定失败（Could not close incremental caches），
# 关闭以保证构建可复现；见 docs/dev/platform.md。
kotlin.incremental=false

# flutter_js_plus 0.0.4（2019 年插件）的编译脚本仍以 Kotlin 1.8 为目标，
# 与 AGP 9 默认的 Java 11 目标不一致；Kotlin 2.4 默认将其视为 error 并中断 assembleDebug。
# 此处降级为 warning 以放行。若日后升级或替换 flutter_js_plus，请删除本行。
# 见 docs/dev/platform.md 的「已知构建变通」一节。
kotlin.jvm.target.validation.mode=warning
